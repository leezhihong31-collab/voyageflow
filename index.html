        const Icons = {
          Plus: (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          ),
          Search: () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          ),
          Trash: () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          ),
          MoveUp: () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
          ),
          MoveDown: () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          ),
          Copy: () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          ),
          Sun: () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          ),

          ),

          ),
          User: () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          ),
          Compass: () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
          ),
          PanelLeft: () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
          )

        const Toast = ({ message, visible }) => (
          <div className={`fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] transition-all duration-300 ${visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'}`}>
            <div className="bg-slate-900 dark:bg-emerald-500 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-2">
              <span className="text-sm font-medium">{message}</span>
            </div>
          </div>
        );

        function App() {
          const [darkMode, setDarkMode] = useState(false);
          const [isSidebarOpen, setIsSidebarOpen] = useState(true);
          const [leftTab, setLeftTab] = useState('discovery'); // 'discovery' | 'community' | 'profile'

          // 用户资料状态
          const [userProfile, setUserProfile] = useState({
            name: 'Alex 🇲🇾',
            bio: '热爱马来西亚美食与海岛的资深背包客，走过槟城、浮罗交怡与亚庇。',
            avatar: 'https://i.pravatar.cc/150?u=my_current_user'
          });
          const [isEditingProfile, setIsEditingProfile] = useState(false);
          const [tempName, setTempName] = useState(userProfile.name);
          const [tempBio, setTempBio] = useState(userProfile.bio);

          // 灵感社区筛选
          const [activeFilter, setActiveFilter] = useState('全部');
          const [searchQuery, setSearchQuery] = useState('');

          // 右侧行程引擎状态
          const [activeDayIndex, setActiveDayIndex] = useState(0);
          const [itinerary, setItinerary] = useState([
            { id: 'day-1', title: '吉隆坡初见与地标打卡', nodes: [] },
          ]);

          const [showExportModal, setShowExportModal] = useState(false);
          const [communityPlans, setCommunityPlans] = useState(INITIAL_COMMUNITY_PLANS);
          const [myPublishedPlans, setMyPublishedPlans] = useState([]);
          const [toast, setToast] = useState({ visible: false, message: '' });

          useEffect(() => {
            if (darkMode) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          }, [darkMode]);

          const showNotification = (msg) => {
            setToast({ visible: true, message: msg });
            setTimeout(() => setToast({ visible: false, message: '' }), 2000);
          };

          const stats = useMemo(() => {
            const totalNodes = itinerary.reduce((sum, day) => sum + day.nodes.length, 0);
            const totalBudget = itinerary.reduce((sum, day) =>
              sum + day.nodes.reduce((dSum, node) => dSum + (Number(node.cost) || 0), 0), 0
            );
            return {
              days: itinerary.length,
              nodes: totalNodes,
              budget: totalBudget
            };
          }, [itinerary]);

          const filteredDiscovery = useMemo(() => {
            return MALAYSIA_DISCOVERY.filter(item => {
              const matchFilter = activeFilter === '全部' || item.category === activeFilter;
              const matchSearch = item.title.includes(searchQuery) || item.location.includes(searchQuery);
              return matchFilter && matchSearch;
            });
          }, [activeFilter, searchQuery]);

          // --- 天数管理 ---
          const addDay = () => {
            const newDay = { id: `day-${Date.now()}`, title: `Day ${itinerary.length + 1} 精彩探索`, nodes: [] };
            setItinerary([...itinerary, newDay]);
            setActiveDayIndex(itinerary.length);
            showNotification(`已添加 Day ${itinerary.length + 1}`);
          };

          const deleteDay = (index, e) => {
            e.stopPropagation();
            if (itinerary.length <= 1) {
              showNotification("至少需要保留一天行程！");
              return;
            }
            const next = [...itinerary];
            next.splice(index, 1);
            setItinerary(next);
            setActiveDayIndex(Math.max(0, index - 1));
            showNotification("已成功删除该天行程");
          };

          // --- 节点管理 ---
          const addToItinerary = (item) => {
            const newNode = {
              id: Date.now().toString(),
              time: '10:00',
              title: item.title,
              location: item.location,
              cost: item.cost,
              note: item.tips || ''
            };
            const next = [...itinerary];
            next[activeDayIndex].nodes.push(newNode);
            setItinerary(next);
            showNotification(`已添加 ${item.title} 到 Day ${activeDayIndex + 1}`);
          };

          const addCustomNode = () => {
            const newNode = {
              id: Date.now().toString(),
              time: '12:00',
              title: '自定义马来西亚新行程',
              location: '输入具体地点...',
              cost: 0,
              note: ''
            };
            const next = [...itinerary];
            next[activeDayIndex].nodes.push(newNode);
            setItinerary(next);
          };

          const updateNode = (dayIdx, nodeIdx, field, value) => {
            const next = [...itinerary];
            next[dayIdx].nodes[nodeIdx][field] = value;
            setItinerary(next);
          };

          const deleteNode = (dayIdx, nodeIdx) => {
            const next = [...itinerary];
            next[dayIdx].nodes.splice(nodeIdx, 1);
            setItinerary(next);
          };

          const moveNode = (dayIdx, nodeIdx, direction) => {
            const next = [...itinerary];
            const nodes = next[dayIdx].nodes;
            if (direction === 'up' && nodeIdx > 0) {
              [nodes[nodeIdx], nodes[nodeIdx - 1]] = [nodes[nodeIdx - 1], nodes[nodeIdx]];
            } else if (direction === 'down' && nodeIdx < nodes.length - 1) {
              [nodes[nodeIdx], nodes[nodeIdx + 1]] = [nodes[nodeIdx + 1], nodes[nodeIdx]];
            }
            setItinerary(next);
          };

          // --- 发布行程 ---
          const handlePublishPlan = () => {
            if (stats.nodes === 0) {
              showNotification("当前行程没有任何节点，无法发布！");
              return;
            }
            const newPlan = {
              id: `plan-${Date.now()}`,
              authorName: userProfile.name,
              authorAvatar: userProfile.avatar,
              title: `${userProfile.name.split(' ')[0]}的马来西亚精选行程`,
              description: userProfile.bio || '探索马来西亚绝美风光与地道美食。',
              likes: 1,
              isLiked: true,
              days: JSON.parse(JSON.stringify(itinerary))
            };

            setCommunityPlans([newPlan, ...communityPlans]);
            setMyPublishedPlans([newPlan, ...myPublishedPlans]);
            showNotification("🎉 行程成功发布至旅行者广场！");
            setLeftTab('community');
          };

          // --- 社区互动 ---
          const handleLikePlan = (planId) => {
            setCommunityPlans(communityPlans.map(p => {
              if (p.id === planId) {
                const liked = p.isLiked;
                return { ...p, isLiked: !liked, likes: liked ? p.likes - 1 : p.likes + 1 };
              }
              return p;
            }));
            showNotification("点赞成功！❤️");
          };

          const loadCommunityPlan = (plan) => {
            setItinerary(JSON.parse(JSON.stringify(plan.days)));
            setActiveDayIndex(0);
            showNotification(`已成功 Copy《${plan.title}》到您的旅游计划！`);
          };

          const copyToClipboard = () => {
            let text = `🇲🇾 VoyageFlow 旅线 - 马来西亚行程计划\n\n`;
            itinerary.forEach((day, i) => {
              text += `📅 Day ${i + 1}: ${day.title}\n`;
              day.nodes.forEach(node => {
                text += `- [${node.time}] ${node.title} (@${node.location}) | 预估: RM${node.cost}\n  备注: ${node.note}\n`;
              });
              text += `\n`;
            });
            text += `📊 总预算: RM${stats.budget} | 共 ${stats.nodes} 个打卡点`;

            navigator.clipboard.writeText(text).then(() => {
              showNotification("行程已成功复制到剪贴板！");
            });
          };

          return (
            <div className="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans transition-colors duration-300">
              <Toast visible={toast.visible} message={toast.message} />

              {/* --- Navigation Header --- */}
              <header className="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
                <div className="max-w-[1600px] mx-auto px-6 h-16 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                      className="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 transition-colors"
                      title={isSidebarOpen ? "收起左侧栏" : "展开左侧栏"}
                    >
                      <Icons.PanelLeft />
                    </button>

                  <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setShowExportModal(false)} />
                  <div className="relative w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
                    <div className="p-6 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
                      <h2 className="text-xl font-bold">导出马来西亚行程计划</h2>
                      <button onClick={() => setShowExportModal(false)} className="text-slate-400 hover:text-slate-600"><Icons.Plus className="rotate-45" /></button>
                    </div>
                    <div className="p-6 flex-1 overflow-y-auto font-mono text-sm text-slate-600 dark:text-slate-400 bg-slate-50 dark:bg-slate-950">
                      <pre className="whitespace-pre-wrap leading-relaxed">
                        {`🇲🇾 VoyageFlow 旅线 - 马来西亚行程计划\n\n`}
                        {itinerary.map((day, i) => (
                          `📅 Day ${i + 1}: ${day.title}\n` +
                          day.nodes.map(node => (
                            `- [${node.time}] ${node.title}\n  📍 地点: ${node.location}\n  💰 预算: RM${node.cost}\n  📝 备注: ${node.note || '无'}`
                          )).join('\n') + `\n\n`
                        ))}
                        {`📊 概览统计:\n- 总规划天数: ${stats.days} 天\n- 行程打卡点: ${stats.nodes} 个\n- 预估总预算: RM ${stats.budget.toLocaleString()}`}
                      </pre>
                    </div>
                    <div className="p-6 border-t border-slate-100 dark:border-slate-800 flex gap-3">
                      <button
                        onClick={copyToClipboard}
                        className="flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold transition-all shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2"
                      >
                        <Icons.Copy />
                        <span>一键复制纯文本</span>
                      </button>
                      <button
                        onClick={() => setShowExportModal(false)}
                        className="px-6 py-3 bg-slate-100 dark:bg-slate-800 rounded-xl font-bold hover:bg-slate-200 transition-all"
                      >
                        返回编辑
                      </button>
                    </div>
                  </div>
                </div>
              )}

              <style dangerouslySetInnerHTML={{ __html: `
                .no-scrollbar::-webkit-scrollbar { display: none; }
                .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
              `}} />
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
